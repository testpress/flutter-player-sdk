group 'com.tpstreams.tpstreams_player_sdk'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.7.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://jitpack.io' }

        maven {
            url "https://github.com/testpress/maven/raw/main/repo"
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.tpstreams.tpstreams_player_sdk"
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
    }

    dependencies {
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.0.0'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

dependencies {
    // TODO: bump once the presence-heartbeat PR (TPStreamsAndroidPlayer
    // feat/presence-sdk-integration) merges and releases — this pinned
    // version predates TPStreamsPlayer.Listener.onPresenceTokenExpired and
    // BaseApiService.assetInfoUrl's viewerId param, so resolvePresenceToken
    // in NativePlayerView.kt will not compile until then.
    implementation "com.github.testpress:TPStreamsAndroidPlayer:1.2.7"
}
