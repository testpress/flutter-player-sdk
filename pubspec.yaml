name: tpstreams_player_sdk
description: TPStreams Player SDK makes it easy to play our DRM-protected and non-DRM content.
version: 2.2.15
homepage: https://tpstreams.com/
documentation: https://developer.tpstreams.com/

environment:
  sdk: '>=3.0.6 <4.0.0'
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  pigeon: ^22.7.1

flutter:
  plugin:
    platforms:
      android:
        package: com.tpstreams.tpstreams_player_sdk
        pluginClass: TpstreamsPlayerSdkPlugin
      ios:
        pluginClass: TpstreamsPlayerSdkPlugin
