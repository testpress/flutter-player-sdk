name: Run Tests

on:
  pull_request:
    branches:
      - main
    paths:
     - 'lib/**'
     - 'test/**'
     - '.github/**'
  push:
    branches:
      - main
    paths:
     - 'lib/**'
     - 'test/**'
     - '.github/**'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Flutter
        uses: subosito/flutter-action@v3
        with:
          flutter-version: 3.13.0

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test