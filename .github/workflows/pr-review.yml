
name: PR Review with Progress Tracking

# Docs:    https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
# Example: https://github.com/anthropics/claude-code-action/blob/main/examples/pr-review-comprehensive.yml

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  review-with-tracking:
    if: |
      github.actor != 'claude[bot]' &&
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude review'))
      )
    runs-on: ubuntu-latest
    concurrency:
      group: pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: PR Review with Progress Tracking
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Review this PR for the **TPStreams Flutter Player SDK** (Flutter plugin wrapping native Android/iOS players for DRM + non-DRM video).

            Flag issues in these areas:

            **Code Quality**
            - Clean code principles and best practices
            - Proper error handling and edge cases
            - Code readability and maintainability

            **Pigeon / Platform Channels**
            - Never edit `*.g.dart` files directly — changes go in `pigeons/`
            - Channel names, codecs, and `messageChannelSuffix` must match Dart ↔ native

            **Resource Lifecycle**
            - `dispose()` must cancel `_positionTimer`, all `StreamSubscription`s, and `ValueNotifier` listeners
            - Check `addListener`/`removeListener` pairing

            **Playback & DRM**
            - Error paths must cover: network failure, expired access token, DRM license expiry, native player errors
            - Offline playback must handle missing license files; `offlineLicenseExpireDays` default is 15

            **Download Manager**
            - `pauseDownload`/`resumeDownload` are unsupported on iOS — must throw `UnsupportedError` and be documented
            - `downloadsStream` is a broadcast stream — safe for multiple listeners, but verify usage

            **Public API / Semver**
            - This is a published pub.dev package — no breaking changes without a major version bump
            - Renames or signature changes to exported types are breaking
            - Typedef aliases (`TestpressPlayer`, `TestpressPlayerController`) must stay in sync

            **Security**
            - Access tokens must never be logged or persisted on the Dart side
            - DRM license data should not be exposed to the Flutter layer

            Use inline comments for specific issues, top-level comments for architectural observations.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

